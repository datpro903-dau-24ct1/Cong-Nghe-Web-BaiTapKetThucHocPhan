{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
  <h1>Đổi mật khẩu</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Lưu mật khẩu mới</button>
  </form>
  <p><a href="{% url 'accounts:profile' %}">← Quay lại hồ sơ</a></p>
{% endblock %}
