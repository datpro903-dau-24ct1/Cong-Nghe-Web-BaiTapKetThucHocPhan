{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
  <h1>Quên mật khẩu</h1>
  <p class="meta">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Gửi liên kết đặt lại</button>
  </form>
  <p><a href="{% url 'accounts:login' %}">← Quay lại đăng nhập</a></p>
{% endblock %}
